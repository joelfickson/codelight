[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]

tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"


serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1"

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


reqwest = { version = "0.12", features = ["json", "stream"] }
eventsource-stream = "0.2"

uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
directories = "6"
clap = { version = "4", features = ["derive"] }


ratatui = "0.30"
tui-input = { version = "0.14", default-features = false }


vc-types   = { path = "crates/vc-types" }
vc-gateway = { path = "crates/vc-gateway" }
vc-tools   = { path = "crates/vc-tools" }
vc-skills  = { path = "crates/vc-skills" }
vc-mcp     = { path = "crates/vc-mcp" }
vc-context = { path = "crates/vc-context" }
vc-agent   = { path = "crates/vc-agent" }
